trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: Terraform-Dev

stages:

# =====================================================
# Stage 0 - Verify Build Agent
# =====================================================

- stage: Verify
  displayName: "Verify Build Agent"

  jobs:
    - job: VerifyAgent
      displayName: "Agent Information"

      steps:
        - checkout: self

        - script: |
            echo "========== Agent Information =========="
            echo "Agent Name: $(Agent.Name)"
            echo "Agent OS: $(Agent.OS)"
            echo "Agent Machine Name: $(Agent.MachineName)"
            echo "Working Directory:"
            pwd

            echo ""
            echo "========== Repository =========="
            ls -la

            echo ""
            echo "========== Repository Structure =========="
            find . -maxdepth 3
          displayName: "Display Agent & Repository Details"

# =====================================================
# Stage 1 - Security Setup
# =====================================================

- stage: SecurityScan
  displayName: "Security Scan"
  dependsOn: Verify

  jobs:
    - job: SecurityCheck
      displayName: "Install Security Tools"

      steps:

        - checkout: self
          fetchDepth: 0

        # Verify Variable Group

        - script: |
            echo "Terraform Version : $(TF_VERSION)"
            echo "Environment       : $(ENVIRONMENT)"
            echo "Location          : $(LOCATION)"
          displayName: "Verify Variable Group"

        # Install Terraform

        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: $(TF_VERSION)

        - script: |
            terraform version
          displayName: "Verify Terraform Installation"

        # Install GitLeaks

        - script: |
            curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
            gitleaks version
          displayName: "Install GitLeaks"
